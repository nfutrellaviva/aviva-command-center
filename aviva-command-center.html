<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aviva Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#111110;font-family:'Plus Jakarta Sans',sans-serif;color:#f9f7f4;font-size:14px}
.app{min-height:100vh;display:flex;flex-direction:column}
.navbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:0.5px solid rgba(249,247,244,0.08);background:#191816;position:sticky;top:0;z-index:100}
.nav-brand{display:flex;align-items:center;gap:14px}
.wordmark{display:flex;flex-direction:column;gap:1px}
.wm-a{font-size:14px;font-weight:500;letter-spacing:0.2em;color:#f9f7f4}
.wm-b{font-size:8px;letter-spacing:0.35em;color:rgba(249,247,244,0.4)}
.nav-title{font-size:13px;color:rgba(249,247,244,0.55);letter-spacing:0.08em;border-left:0.5px solid rgba(249,247,244,0.15);padding-left:14px}
.nav-right{display:flex;align-items:center;gap:12px}
.nav-btn{background:none;border:0.5px solid rgba(249,247,244,0.18);color:rgba(249,247,244,0.7);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit}
.nav-btn:hover{background:rgba(249,247,244,0.06);color:#f9f7f4}
.body-wrap{display:flex;flex:1;overflow:hidden}
.sidebar{width:200px;min-width:200px;background:#191816;border-right:0.5px solid rgba(249,247,244,0.08);padding:20px 0;display:flex;flex-direction:column;height:calc(100vh - 53px);position:sticky;top:53px;overflow-y:auto}
.sidebar-section{padding:0 16px 16px}
.sidebar-label{font-size:10px;letter-spacing:0.12em;color:rgba(249,247,244,0.3);text-transform:uppercase;margin-bottom:8px;padding:0 4px}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;cursor:pointer;color:rgba(249,247,244,0.6);font-size:13px;transition:all 0.15s;margin-bottom:2px}
.nav-item:hover{background:rgba(249,247,244,0.06);color:#f9f7f4}
.nav-item.active{background:rgba(196,118,58,0.15);color:#c4763a;font-weight:500}
.main{flex:1;overflow-y:auto;padding:28px 32px;height:calc(100vh - 53px)}
.page{display:none}
.page.active{display:block}
.page-title{font-size:18px;font-weight:500;margin-bottom:6px}
.page-sub{font-size:13px;color:rgba(249,247,244,0.45);margin-bottom:24px}
.stats-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.stat-pill{background:#191816;border:0.5px solid rgba(249,247,244,0.08);border-radius:8px;padding:8px 14px;font-size:12px;color:rgba(249,247,244,0.6)}
.stat-pill b{color:#f9f7f4;font-weight:600;margin-right:4px}
.stat-pill.urgent b{color:#e87070}
.add-task-form{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.add-task-input{flex:1;min-width:200px;background:#191816;border:0.5px solid rgba(249,247,244,0.12);color:#f9f7f4;padding:8px 12px;border-radius:6px;font-family:inherit;font-size:13px;outline:none}
.add-task-input:focus{border-color:rgba(196,118,58,0.5)}
.add-task-input::placeholder{color:rgba(249,247,244,0.25)}
.btn-primary{background:#7b4518;border:none;color:#f9f7f4;padding:8px 14px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;white-space:nowrap}
.btn-primary:hover{background:#8f5120}
select.form-select,input.form-input{background:#191816;border:0.5px solid rgba(249,247,244,0.12);color:#f9f7f4;padding:8px 11px;border-radius:6px;font-family:inherit;font-size:13px;outline:none}
.task-controls{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-label{font-size:10px;color:rgba(249,247,244,0.3);letter-spacing:0.08em}
.filter-btn{background:none;border:0.5px solid rgba(249,247,244,0.15);color:rgba(249,247,244,0.5);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit}
.filter-btn:hover,.filter-btn.active{background:rgba(196,118,58,0.15);border-color:rgba(196,118,58,0.4);color:#c4763a}
.task-list{display:flex;flex-direction:column;gap:6px}
.task-item{background:#191816;border:0.5px solid rgba(249,247,244,0.06);border-radius:8px;padding:12px 14px;display:flex;align-items:flex-start;gap:10px}
.task-item:hover{border-color:rgba(249,247,244,0.14)}
.task-item.done{opacity:0.45}
.task-check{width:16px;height:16px;min-width:16px;border:0.5px solid rgba(249,247,244,0.25);border-radius:3px;margin-top:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px}
.task-check.checked{background:#7b4518;border-color:#7b4518;color:#f9f7f4}
.task-body{flex:1;min-width:0}
.task-title{font-size:13px;color:#f9f7f4;margin-bottom:4px;line-height:1.4}
.task-item.done .task-title{text-decoration:line-through;color:rgba(249,247,244,0.35)}
.task-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pri-badge{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:500}
.pri-badge.urgent{background:rgba(220,60,50,0.15);color:#e87070;border:0.5px solid rgba(220,60,50,0.2)}
.pri-badge.high{background:rgba(196,118,58,0.15);color:#e8a06a;border:0.5px solid rgba(196,118,58,0.2)}
.pri-badge.normal{background:rgba(249,247,244,0.06);color:rgba(249,247,244,0.4);border:0.5px solid rgba(249,247,244,0.1)}
.src-tag{font-size:10px;color:rgba(249,247,244,0.3)}
.due-tag{font-size:10px;color:rgba(249,247,244,0.35)}
.due-tag.overdue{color:#e87070}
.due-tag.soon{color:#e8a06a}
.edit-btn{background:none;border:0.5px solid rgba(249,247,244,0.1);color:rgba(249,247,244,0.4);padding:4px 8px;border-radius:4px;cursor:pointer;font-size:11px;font-family:inherit;flex-shrink:0}
.edit-btn:hover{color:#f9f7f4;border-color:rgba(249,247,244,0.3)}
.kanban-board{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;align-items:start;overflow-x:auto}
.kanban-col{background:#191816;border:0.5px solid rgba(249,247,244,0.07);border-radius:10px;min-width:180px}
.kanban-col-header{padding:12px 14px;border-bottom:0.5px solid rgba(249,247,244,0.07);display:flex;align-items:center;justify-content:space-between}
.kanban-col-title{font-size:11px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:rgba(249,247,244,0.6)}
.kanban-count{font-size:11px;background:rgba(249,247,244,0.08);color:rgba(249,247,244,0.4);padding:2px 7px;border-radius:10px}
.kanban-tasks{padding:10px;display:flex;flex-direction:column;gap:7px;min-height:60px}
.kanban-task{background:#111110;border:0.5px solid rgba(249,247,244,0.07);border-radius:7px;padding:10px 11px;cursor:pointer}
.kanban-task:hover{border-color:rgba(249,247,244,0.2)}
.kanban-task-title{font-size:12px;color:#f9f7f4;line-height:1.45;margin-bottom:6px}
.kanban-task-footer{display:flex;align-items:center;justify-content:space-between;gap:4px;flex-wrap:wrap}
.status-badge{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:500;white-space:nowrap}
.status-ns{background:rgba(70,110,200,0.12);color:#7099e8;border:0.5px solid rgba(70,110,200,0.2)}
.status-ip{background:rgba(100,100,100,0.15);color:rgba(249,247,244,0.55);border:0.5px solid rgba(100,100,100,0.2)}
.status-wait{background:rgba(200,170,50,0.12);color:#d4b84a;border:0.5px solid rgba(200,170,50,0.2)}
.status-done{background:rgba(40,160,100,0.12);color:#5cbf8a;border:0.5px solid rgba(40,160,100,0.2)}
.status-defer{background:rgba(196,118,58,0.12);color:#c4763a;border:0.5px solid rgba(196,118,58,0.2)}
.due-small{font-size:10px;color:rgba(249,247,244,0.3)}
.due-small.soon{color:#e8a06a}
.due-small.overdue{color:#e87070}
.add-kanban-btn{width:100%;background:none;border:none;border-top:0.5px solid rgba(249,247,244,0.05);color:rgba(249,247,244,0.25);padding:8px;font-size:12px;cursor:pointer;font-family:inherit}
.add-kanban-btn:hover{color:rgba(249,247,244,0.6);background:rgba(249,247,244,0.04)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#1e1d1b;border:0.5px solid rgba(249,247,244,0.12);border-radius:12px;padding:24px;width:500px;max-width:96vw;max-height:88vh;overflow-y:auto}
.modal h3{font-size:15px;font-weight:500;margin-bottom:18px}
.form-row{margin-bottom:14px}
.form-label{font-size:10px;color:rgba(249,247,244,0.35);margin-bottom:5px;letter-spacing:0.08em;text-transform:uppercase}
.form-input,.form-select,.form-textarea{width:100%;background:#111110;border:0.5px solid rgba(249,247,244,0.12);color:#f9f7f4;padding:8px 11px;border-radius:6px;font-family:inherit;font-size:13px;outline:none}
.form-textarea{min-height:120px;resize:vertical;line-height:1.6}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.btn-cancel{background:none;border:0.5px solid rgba(249,247,244,0.15);color:rgba(249,247,244,0.5);padding:7px 14px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:13px}
.btn-cancel:hover{color:#f9f7f4;border-color:rgba(249,247,244,0.3)}
.btn-delete{background:none;border:0.5px solid rgba(220,60,50,0.3);color:#e87070;padding:7px 14px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:13px;margin-right:auto}
.empty-state{color:rgba(249,247,244,0.25);font-size:13px;padding:40px 20px;text-align:center}
</style>
</head>
<body>
<div class="app">
<div class="navbar">
  <div class="nav-brand">
    <div class="wordmark"><span class="wm-a">AVIVA</span><span class="wm-b">AESTHETICS</span></div>
    <span class="nav-title">Command Center</span>
  </div>
  <div class="nav-right">
    <span id="syncTime" style="font-size:11px;color:rgba(249,247,244,0.3)"></span>
    <button class="nav-btn" onclick="exportBackup()">Export backup</button>
  </div>
</div>
<div class="body-wrap">
<div class="sidebar">
  <div class="sidebar-section">
    <div class="sidebar-label">Navigation</div>
    <div class="nav-item active" id="navTasks" onclick="showPage('tasks',this)"><span>✓</span> My Tasks</div>
    <div class="nav-item" id="navVP" onclick="showPage('vp',this)"><span>◈</span> VP Plan</div>
  </div>
  <div style="height:0.5px;background:rgba(249,247,244,0.08);margin:0 16px 16px"></div>
  <div class="sidebar-section">
    <div class="sidebar-label">Mobile Sync</div>
    <div id="mobileStatus" style="font-size:11px;color:rgba(249,247,244,0.45);margin-bottom:8px;line-height:1.5">Not synced yet</div>
    <button class="nav-btn" style="width:100%;font-size:11px" onclick="syncMobile()">&#8635; Sync mobile now</button>
  </div>
</div>

<div class="main">

<div class="page active" id="page-tasks">
  <div class="page-title">My Tasks</div>
  <div class="page-sub">All your tasks in one place</div>
  <div class="stats-row" id="statsRow"></div>
  <div class="add-task-form">
    <input class="add-task-input" id="newTaskInput" placeholder="Add a task..." onkeydown="if(event.key==='Enter')addTask()">
    <select id="newTaskPri" class="form-select" style="width:110px">
      <option value="normal">Normal</option>
      <option value="high">High</option>
      <option value="urgent">Urgent</option>
    </select>
    <input type="date" id="newTaskDue" class="form-input" style="width:150px">
    <button class="btn-primary" onclick="addTask()">+ Add</button>
  </div>
  <div class="task-controls" id="taskFilters">
    <span class="filter-label">VIEW</span>
    <button class="filter-btn active" onclick="filterTasks('all',this)">All open</button>
    <button class="filter-btn" onclick="filterTasks('urgent',this)">Urgent</button>
    <button class="filter-btn" onclick="filterTasks('high',this)">High</button>
    <button class="filter-btn" onclick="filterTasks('done',this)">Done</button>
    <span class="filter-label" style="margin-left:8px">SORT</span>
    <button class="filter-btn active" id="sortPri" onclick="setSort('priority',this)">By priority</button>
    <button class="filter-btn" id="sortDue" onclick="setSort('due',this)">By due date</button>
  </div>
  <div class="task-list" id="taskList"></div>
</div>

<div class="page" id="page-vp">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
    <div class="page-title">Year 1 VP Plan</div>
    <button class="btn-primary" onclick="openAddVp('')">+ Add Task</button>
  </div>
  <div class="page-sub" id="vpSub"></div>
  <div class="kanban-board" id="kanbanBoard"></div>
  <div style="margin-top:24px">
    <div style="font-size:11px;font-weight:500;color:rgba(249,247,244,0.4);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:12px">Completed</div>
    <div class="task-list" id="vpDoneList"></div>
  </div>
</div>

</div>
</div>
</div>

<div class="modal-overlay" id="editModal">
<div class="modal">
  <h3>Edit Task</h3>
  <div class="form-row"><div class="form-label">Title</div><input class="form-input" id="editTitle"></div>
  <div class="form-row"><div class="form-label">Priority</div>
    <select class="form-select" id="editPri">
      <option value="urgent">Urgent</option>
      <option value="high">High</option>
      <option value="normal">Normal</option>
    </select>
  </div>
  <div class="form-row"><div class="form-label">Due Date</div><input type="date" class="form-input" id="editDue"></div>
  <div class="form-row"><div class="form-label">Detail / Notes</div><textarea class="form-textarea" id="editDetail"></textarea></div>
  <div class="modal-btns">
    <button class="btn-delete" onclick="deleteEditTask()">Delete</button>
    <button class="btn-cancel" onclick="closeModal('editModal')">Cancel</button>
    <button class="btn-primary" onclick="saveEdit()">Save</button>
  </div>
</div>
</div>

<div class="modal-overlay" id="vpModal">
<div class="modal">
  <h3 id="vpModalTitle">VP Plan Task</h3>
  <div class="form-row"><div class="form-label">Task Name</div><input class="form-input" id="vpName"></div>
  <div class="form-row"><div class="form-label">Section</div>
    <select class="form-select" id="vpSection">
      <option>Q1</option><option>Q2</option><option>Q3</option><option>Q4+</option><option>Ideas</option><option>Completed</option>
    </select>
  </div>
  <div class="form-row"><div class="form-label">Status</div>
    <select class="form-select" id="vpStatus">
      <option>Not Started</option><option>In Progress</option><option>Waiting</option><option>Deferred</option><option>Done</option>
    </select>
  </div>
  <div class="form-row"><div class="form-label">Due Date</div><input type="date" class="form-input" id="vpDue"></div>
  <div class="form-row"><div class="form-label">Notes</div><textarea class="form-textarea" id="vpNotes"></textarea></div>
  <div class="modal-btns">
    <button class="btn-delete" id="vpDeleteBtn" onclick="deleteVp()">Delete</button>
    <button class="btn-cancel" onclick="closeModal('vpModal')">Cancel</button>
    <button class="btn-primary" onclick="saveVp()">Save</button>
  </div>
</div>
</div>

// Storage key (separate from old broken one so we get fresh start)
const STORAGE_KEY = 'aviva_cc_clean';

let tasks = [];
let doneIds = new Set();
let vp = [];
let curFilter = 'all';
let curSort = 'priority';
let editId = null;
let editVpId = null;

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      tasks = d.tasks || SEED_TASKS;
      doneIds = new Set(d.doneIds || SEED_DONE);
      vp = d.vp || SEED_VP;
    } else {
      tasks = JSON.parse(JSON.stringify(SEED_TASKS));
      doneIds = new Set(SEED_DONE);
      vp = JSON.parse(JSON.stringify(SEED_VP));
    }
  } catch(e) {
    tasks = JSON.parse(JSON.stringify(SEED_TASKS));
    doneIds = new Set(SEED_DONE);
    vp = JSON.parse(JSON.stringify(SEED_VP));
  }
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      tasks: tasks, doneIds: [...doneIds], vp: vp
    }));
  } catch(e) {}
}

function h(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function dueFmt(due) {
  if (!due) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(due + 'T00:00:00');
  const diff = Math.round((d - today) / 86400000);
  if (diff < 0) return { txt: Math.abs(diff) + 'd overdue', cls: 'overdue' };
  if (diff === 0) return { txt: 'Due today', cls: 'soon' };
  if (diff <= 3) return { txt: 'Due in ' + diff + 'd', cls: 'soon' };
  return { txt: d.toLocaleDateString('en-US', {month:'short', day:'numeric'}), cls: '' };
}

function statusBadge(s) {
  const m = {'Not Started':'status-ns','In Progress':'status-ip','Waiting':'status-wait','Done':'status-done','Deferred':'status-defer'};
  return '<span class="status-badge ' + (m[s]||'status-ns') + '">' + h(s) + '</span>';
}

function showPage(id, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  if (el) el.classList.add('active');
}

function renderStats() {
  const open = tasks.filter(t => !doneIds.has(t.id));
  const urgent = open.filter(t => t.priority === 'urgent').length;
  const high = open.filter(t => t.priority === 'high').length;
  const done = tasks.filter(t => doneIds.has(t.id)).length;
  const today = new Date(); today.setHours(0,0,0,0);
  const overdue = open.filter(t => t.due && new Date(t.due+'T00:00:00') < today).length;
  document.getElementById('statsRow').innerHTML =
    '<div class="stat-pill"><b>' + open.length + '</b>Open</div>' +
    '<div class="stat-pill urgent"><b>' + urgent + '</b>Urgent</div>' +
    '<div class="stat-pill"><b>' + high + '</b>High</div>' +
    '<div class="stat-pill"><b>' + overdue + '</b>Overdue</div>' +
    '<div class="stat-pill"><b>' + done + '</b>Done</div>';
}

function taskHTML(t) {
  const isDone = doneIds.has(t.id);
  const due = dueFmt(t.due);
  const detail = t.detail && t.detail !== 'Added manually' && t.detail !== 'Added on iPhone'
    ? '<span class="src-tag" style="color:rgba(249,247,244,0.25);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + h(t.detail.substring(0,80)) + (t.detail.length>80?'...':'') + '</span>'
    : '';
  const from = t.from && t.from !== 'You' ? '<span class="src-tag">from: ' + h(t.from) + '</span>' : '';
  return '<div class="task-item ' + (isDone?'done':'') + '">' +
    '<div class="task-check ' + (isDone?'checked':'') + '" onclick="toggleDone(\'' + t.id + '\')">' + (isDone?'✓':'') + '</div>' +
    '<div class="task-body">' +
      '<div class="task-title">' + h(t.title) + '</div>' +
      '<div class="task-meta">' +
        '<span class="pri-badge ' + t.priority + '">' + t.priority + '</span>' +
        '<span class="src-tag">' + (t.source||'manual') + '</span>' +
        from +
        (due ? '<span class="due-tag ' + due.cls + '">' + due.txt + '</span>' : '') +
        detail +
      '</div>' +
    '</div>' +
    '<button class="edit-btn" onclick="openEdit(\'' + t.id + '\')">Edit</button>' +
  '</div>';
}

function renderTasks() {
  const tl = document.getElementById('taskList');
  if (!tl) return;
  let list = tasks.slice();
  if (curFilter === 'done') list = list.filter(t => doneIds.has(t.id));
  else {
    list = list.filter(t => !doneIds.has(t.id));
    if (curFilter === 'urgent') list = list.filter(t => t.priority === 'urgent');
    else if (curFilter === 'high') list = list.filter(t => t.priority === 'high');
  }
  if (curSort === 'due') {
    list.sort((a,b) => {
      if (!a.due && !b.due) return 0;
      if (!a.due) return 1;
      if (!b.due) return -1;
      return new Date(a.due) - new Date(b.due);
    });
  } else {
    list.sort((a,b) => {
      const o = {urgent:0,high:1,normal:2};
      return (o[a.priority]||2) - (o[b.priority]||2);
    });
  }
  tl.innerHTML = list.length ? list.map(taskHTML).join('') : '<div class="empty-state">No tasks here</div>';
  renderStats();
}

function filterTasks(f, el) {
  curFilter = f;
  document.querySelectorAll('#taskFilters .filter-btn').forEach(b => {
    if (b.onclick && b.onclick.toString().includes("filterTasks")) b.classList.remove('active');
  });
  if (el) el.classList.add('active');
  renderTasks();
}

function setSort(s, el) {
  curSort = s;
  document.getElementById('sortPri').classList.remove('active');
  document.getElementById('sortDue').classList.remove('active');
  if (el) el.classList.add('active');
  renderTasks();
}

function toggleDone(id) {
  if (doneIds.has(id)) doneIds.delete(id);
  else doneIds.add(id);
  saveData();
  renderTasks();
}

function addTask() {
  const inp = document.getElementById('newTaskInput');
  const v = inp.value.trim();
  if (!v) return;
  tasks.unshift({
    id: 't' + Date.now(),
    title: v,
    detail: 'Added manually',
    from: 'You',
    priority: document.getElementById('newTaskPri').value,
    source: 'manual',
    due: document.getElementById('newTaskDue').value || null
  });
  inp.value = '';
  document.getElementById('newTaskDue').value = '';
  saveData();
  renderTasks();
}

function openEdit(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  editId = id;
  document.getElementById('editTitle').value = t.title || '';
  document.getElementById('editPri').value = t.priority || 'normal';
  document.getElementById('editDue').value = t.due || '';
  document.getElementById('editDetail').value = (t.detail && t.detail !== 'Added manually' && t.detail !== 'Added on iPhone') ? t.detail : '';
  document.getElementById('editModal').classList.add('open');
}

function saveEdit() {
  const t = tasks.find(x => x.id === editId);
  if (!t) return;
  t.title = document.getElementById('editTitle').value.trim() || t.title;
  t.priority = document.getElementById('editPri').value;
  t.due = document.getElementById('editDue').value || null;
  const d = document.getElementById('editDetail').value.trim();
  if (d) t.detail = d;
  saveData();
  renderTasks();
  closeModal('editModal');
}

function deleteEditTask() {
  if (!editId) return;
  if (!confirm('Delete this task?')) return;
  tasks = tasks.filter(x => x.id !== editId);
  doneIds.delete(editId);
  saveData();
  renderTasks();
  closeModal('editModal');
}

function renderKanban() {
  const board = document.getElementById('kanbanBoard');
  if (!board) return;
  const cols = ['Q1','Q2','Q3','Q4+','Ideas'];
  board.innerHTML = cols.map(col => {
    const items = vp.filter(t => t.section === col);
    const cards = items.map(t => {
      const due = dueFmt(t.due);
      return '<div class="kanban-task" onclick="openVpEdit(\'' + t.id + '\')">' +
        '<div class="kanban-task-title">' + h(t.name) + '</div>' +
        '<div class="kanban-task-footer">' + statusBadge(t.status) +
          (due ? '<span class="due-small ' + due.cls + '">' + due.txt + '</span>' : '') +
        '</div>' +
      '</div>';
    }).join('');
    return '<div class="kanban-col">' +
      '<div class="kanban-col-header"><span class="kanban-col-title">' + col + '</span><span class="kanban-count">' + items.length + '</span></div>' +
      '<div class="kanban-tasks">' + cards + '</div>' +
      '<button class="add-kanban-btn" onclick="openAddVp(\'' + col + '\')">+ Add task</button>' +
    '</div>';
  }).join('');

  const done = vp.filter(t => t.section === 'Completed');
  document.getElementById('vpSub').textContent = done.length + ' of ' + vp.length + ' tasks complete · ' + (vp.length - done.length) + ' remaining';
  const dl = document.getElementById('vpDoneList');
  dl.innerHTML = done.map(t =>
    '<div class="task-item done" onclick="openVpEdit(\'' + t.id + '\')">' +
      '<div class="task-check checked">✓</div>' +
      '<div class="task-body"><div class="task-title">' + h(t.name) + '</div></div>' +
    '</div>'
  ).join('') || '<div class="empty-state">No completed items</div>';
}

function openAddVp(section) {
  editVpId = null;
  document.getElementById('vpModalTitle').textContent = 'Add VP Plan Task';
  document.getElementById('vpName').value = '';
  document.getElementById('vpSection').value = section || 'Q1';
  document.getElementById('vpStatus').value = 'Not Started';
  document.getElementById('vpDue').value = '';
  document.getElementById('vpNotes').value = '';
  document.getElementById('vpDeleteBtn').style.display = 'none';
  document.getElementById('vpModal').classList.add('open');
}

function openVpEdit(id) {
  const t = vp.find(x => x.id === id);
  if (!t) return;
  editVpId = id;
  document.getElementById('vpModalTitle').textContent = 'Edit VP Plan Task';
  document.getElementById('vpName').value = t.name || '';
  document.getElementById('vpSection').value = t.section || 'Q1';
  document.getElementById('vpStatus').value = t.status || 'Not Started';
  document.getElementById('vpDue').value = t.due || '';
  document.getElementById('vpNotes').value = t.notes || '';
  document.getElementById('vpDeleteBtn').style.display = 'inline-block';
  document.getElementById('vpModal').classList.add('open');
}

function saveVp() {
  const name = document.getElementById('vpName').value.trim();
  if (!name) return;
  const data = {
    id: editVpId || 'vp' + Date.now(),
    name: name,
    section: document.getElementById('vpSection').value,
    status: document.getElementById('vpStatus').value,
    due: document.getElementById('vpDue').value || null,
    notes: document.getElementById('vpNotes').value
  };
  if (data.status === 'Done') data.section = 'Completed';
  if (editVpId) {
    const i = vp.findIndex(x => x.id === editVpId);
    if (i >= 0) vp[i] = data;
  } else {
    vp.push(data);
  }
  saveData();
  renderKanban();
  closeModal('vpModal');
}

function deleteVp() {
  if (!editVpId) return;
  if (!confirm('Delete this VP Plan item?')) return;
  vp = vp.filter(x => x.id !== editVpId);
  saveData();
  renderKanban();
  closeModal('vpModal');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
});

function exportBackup() {
  const data = {
    tasks: tasks,
    doneIds: [...doneIds],
    vp: vp,
    exportDate: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'aviva-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// === Mobile Sync via Supabase ===
const SUPA_URL = 'https://sxftnwjfqbnsyrccyzrk.supabase.co';
const SUPA_KEY = 'sb_publishable_eNB2PcRyjgBXc4EjqWFt1g_6d68hhbK';
const SUPA_ROW = 'aviva-mobile-tasks';

function setMobileStatus(text, color) {
  const el = document.getElementById('mobileStatus');
  if (!el) return;
  el.textContent = text;
  el.style.color = color || 'rgba(249,247,244,0.45)';
}

async function syncMobile() {
  if (window.location.protocol === 'file:') {
    setMobileStatus('Mobile sync only works when hosted on GitHub Pages', '#e8a06a');
    return;
  }
  setMobileStatus('Syncing...', 'rgba(249,247,244,0.6)');
  try {
    const res = await fetch(SUPA_URL + '/rest/v1/mobile_tasks?id=eq.' + SUPA_ROW + '&select=data', {
      headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY }
    });
    if (!res.ok) throw new Error('Status ' + res.status);
    const rows = await res.json();
    if (!rows || !rows.length || !rows[0].data) {
      setMobileStatus('Mobile: no tasks yet');
      return;
    }
    const remote = rows[0].data;
    const remoteTasks = remote.tasks || [];
    const remoteDone = new Set(remote.doneIds || []);
    let added = 0;
    remoteTasks.forEach(t => {
      // Skip if already in our local list, or already marked done locally
      if (doneIds.has(t.id)) return;
      if (!tasks.find(x => x.id === t.id)) {
        tasks.unshift(t);
        added++;
      }
    });
    // Merge done IDs from mobile (tasks completed on phone become completed here)
    remoteDone.forEach(id => doneIds.add(id));
    const now = new Date().toLocaleTimeString('en-US', {hour:'numeric',minute:'2-digit'});
    setMobileStatus('Synced at ' + now + (added ? ' (+' + added + ' new)' : ' (up to date)'), '#5cbf8a');
    saveData();
    renderTasks();
  } catch(e) {
    console.error('Mobile sync error:', e);
    setMobileStatus('Sync failed: ' + e.message, '#e87070');
  }
}

// === Init - runs after DOM is parsed because script is at end of body ===
loadData();
renderTasks();
renderKanban();
document.getElementById('syncTime').textContent = 'Loaded ' + new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});

// Auto-sync mobile on load (after 1s) and every 5 minutes
setTimeout(syncMobile, 1000);
setInterval(syncMobile, 5 * 60 * 1000);
